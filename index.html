<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}e.append(...c.flat(9).filter(x=>x!=null&&x!==false));return e};
const DEF={
packages:[
{id:'basic',name:'Basic',price:80000,best:'Tailors, small shops, vendors',features:['Company logo and branding','Customer details: name, phone, address','Add items with quantity, rate and auto total','₦ Naira symbol with optional 7.5% VAT','Generate PDF and print invoice','Works on mobile and computer','1 day delivery']},
{id:'pro',name:'Pro',price:200000,best:'Superstores, pharmacies, schools, hotels',features:['Save and load old invoices','Customer database','Product and item database','Invoice, receipt and quotation documents','Company phone, email and address on documents','Signature and stamp section','Share PDF to WhatsApp','Works offline','5 days delivery and 3 months support']},
{id:'premium',name:'Premium',price:500000,best:'Chains and big companies',features:['Android APK app','Sales reports and daily summary','Inventory and stock tracking','Barcode scanner','Multi-user staff login','Cloud backup','2 weeks delivery and 6 months support']}],
addons:[{label:'Google Play Store upload',price:50000,suffix:''},{label:'Yearly maintenance support',price:30000,suffix:' / yr'}],

seller:{name:'Wil-Obi Merchandise Nig Ltd',phone:'07036536587',email:'',address:'',bankName:'',accName:'',accNo:'',logo:''}};
const KEY='wilobi-v1',clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&Array.isArray(o.packages)&&Array.isArray(o.addons)){const sl={...DEF.seller,...o.seller};if(sl.name==='Wil-Obi Tech Solutions')sl.name=DEF.seller.name;return{...clone(DEF),...o,seller:sl}}}catch(e){}return clone(DEF)}
let S=load(),D=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=k=>'₦'+(k/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>Number(n).toLocaleString('en-NG');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'–';

const wa=()=>{let d=S.seller.phone.replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);return 'https://wa.me/'+d};

/* amount in words, tables, logo */
const W1=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],W10=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'],SC=['','thousand','million','billion','trillion'];
const w99=n=>n<20?W1[n]:W10[Math.floor(n/10)]+(n%10?'-'+W1[n%10]:'');
const w999=n=>n>=100?W1[Math.floor(n/100)]+' hundred'+(n%100?' and '+w99(n%100):''):w99(n);
function words(k){let n=Math.floor(k/100);const ko=k%100,g=[];if(n===0&&ko===0)return 'Zero naira only';
while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
const parts=[];for(let i=g.length-1;i>=0;i--){if(!g[i])continue;parts.push((i===0&&g.length>1&&g[0]<100?'and ':'')+w999(g[i])+(SC[i]?' '+SC[i]:''))}
let s=parts.join(' ');if(parts.length)s+=' naira';if(ko)s+=(parts.length?' and ':'')+w99(ko)+' kobo';
return s.charAt(0).toUpperCase()+s.slice(1)+' only'}
const cell=(t,c='')=>el('div',{class:c,role:'cell'},t);
function invTable(rows){
const hd=el('div',{class:'rw',role:'row'},['SN','Service description','Qty','Rate','Total'].map((t,i)=>el('div',{class:i>1?'n':'',role:'columnheader'},t)));
return el('div',{class:'pi'},el('div',{class:'tb',role:'table','aria-label':'Invoice items'},hd,rows.map((i,n)=>el('div',{class:'rw',role:'row'},cell(String(n+1)),cell(i.desc),cell(String(i.qty),'n'),cell(fmt(Math.round(i.rate*100)),'n'),cell(fmt(lineAmt(i)),'n')))))}
function payTable(s){const r=(a,b)=>el('div',{class:'rw',role:'row'},el('div',{role:'rowheader'},a),el('div',{role:'cell'},b||'–'));
return el('div',{class:'pay',role:'table','aria-label':'Payment information'},el('div',{class:'rw',role:'row'},el('div',{role:'columnheader'},'Payment information')),r('Bank name',s.bankName),r('Account name',s.accName),r('Account number',s.accNo),r('Payment reference',D.no))}
function placeWm(){const p=$('#paper');p.querySelectorAll('.wmt').forEach(x=>x.remove());
const w=p.clientWidth,h=p.offsetHeight;if(!S.seller.logo||!w||!h)return;
const tile=w*271/210,sz=w/2,n=Math.ceil(h/tile)+1;
for(let i=0;i<n;i++)p.prepend(el('div',{class:'wmt',style:`left:25%;width:50%;height:${sz}px;top:${i*tile+(tile-sz)/2}px`},el('img',{src:S.seller.logo,alt:''})))}
function renderBrand(){const s=S.seller,l=$('#brandLg');$('#brandName').textContent=s.name;l.className=s.logo?'lg im':'lg';l.replaceChildren(s.logo?el('img',{src:s.logo,alt:''}):(s.name||'W')[0].toUpperCase())}
function pickLogo(f){if(!f)return;const r=new FileReader();
r.onload=()=>{const im=new Image();
im.onload=()=>{const w=im.naturalWidth||300,h=im.naturalHeight||300,m=Math.max(w,h),side=Math.min(512,m),k=side/m,c=document.createElement('canvas');c.width=c.height=side;
c.getContext('2d').drawImage(im,(side-w*k)/2,(side-h*k)/2,w*k,h*k);
S.seller.logo=c.toDataURL('image/png');save();renderBrand();buildForm();renderPaper();toast('Logo added')};
im.onerror=()=>toast('Could not read that image. Try a PNG or JPG.');im.src=r.result};
r.readAsDataURL(f)}

/* editable text */
const ed=(txt,cls,fn,label)=>{const e=el('span',{class:cls,contenteditable:'true',role:'textbox','aria-label':label,spellcheck:'false'},txt);
e.addEventListener('input',()=>fn(e.textContent.trim()));

/* documents */
const root=k=>k.startsWith('seller.')?S:D;
const get=k=>k.split('.').reduce((o,p)=>o?.[p],root(k));
const set=(k,v)=>{const a=k.split('.'),l=a.pop();a.reduce((o,p)=>o[p],root(k))[l]=v};
const lineAmt=i=>Math.round(i.qty*Math.round(i.rate*100));
function totals(){
const sub=D.items.reduce((s,i)=>s+lineAmt(i),0),disc=D.discType==='pct'?Math.round(sub*Math.min(D.discount,100)/100):Math.min(Math.round(D.discount*100),sub),base=sub-disc;
const vat=D.vat?Math.round(base*75/1000):0,total=base+vat;
const paid=D.type==='quotation'?0:Math.min(Math.round(D.paid*100),total);
return{sub,disc,vat,total,paid,bal:total-paid}}
function startDoc(id,type='invoice'){
const p=S.packages.find(x=>x.id===id)||S.packages[0],t=new Date(),due=new Date(t.getTime()+14*864e5);
D={type,pkg:p.id,no:mkNo(type),date:iso(t),due:iso(due),client:{name:'',phone:'',address:''},vat:true,discount:0,discType:'amt',paid:0,notes:'',items:[{desc:p.name+' package – invoice app',qty:1,rate:p.price}]};

function loadPackage(id){const p=S.packages.find(x=>x.id===id);if(!p)return;D.pkg=id;D.items=[{desc:p.name+' package – invoice app',qty:1,rate:p.price}];if(D.type==='receipt')D.paid=totals().total/100;buildForm();renderPaper()}
function setType(t){D.type=t;D.no=mkNo(t);if(t==='receipt'&&!D.paid)D.paid=totals().total/100;buildForm();renderPaper()}
function fillItems(){
$('#items').replaceChildren(D.items.map((it,i)=>el('div',{class:'ir'},

el('label',{class:'ck'},el('input',{type:'checkbox','data-k':'vat',checked:D.vat}),'Add 7.5% VAT'),
el('label',{},'Discount type',el('select',{'data-k':'discType'},[['amt','Amount (₦)'],['pct','Percent (%)']].map(([v,t])=>el('option',{value:v,selected:D.discType===v},t)))),fld(D.discType==='pct'?'Discount (%)':'Discount (₦)','discount',numA),
ty==='quotation'?null:fld(ty==='receipt'?'Amount received (₦)':'Amount paid so far (₦)','paid',numA),
el('label',{},'Notes',el('textarea',{rows:3,'data-k':'notes'},D.notes)),
el('details',{open:true},el('summary',{},'Your business details'),
el('div',{class:'logobox'},el('div',{class:'ph'},S.seller.logo?el('img',{src:S.seller.logo,alt:'Your logo'}):'Your logo'),el('div',{},el('label',{class:'btn',style:'display:inline-block;margin:0;cursor:pointer;color:var(--ink)'},'Upload logo',el('input',{type:'file',accept:'image/*',hidden:true,onchange:e=>pickLogo(e.target.files[0])})),S.seller.logo?el('button',{class:'btn',type:'button',style:'margin-left:6px',onclick:()=>{S.seller.logo='';save();renderBrand();buildForm();renderPaper()}},'Remove'):null)),
fld('Business name','seller.name'),fld('Address','seller.address'),fld('Contact (phone)','seller.phone',{type:'tel'}),fld('Email','seller.email',{type:'email'}),
el('h3',{},'Payment information (invoices)'),fld('Bank name','seller.bankName'),fld('Account name','seller.accName'),fld('Account number','seller.accNo',{inputmode:'numeric'})),
el('div',{class:'acts'},el('button',{class:'btn go',type:'button',onclick:()=>exportPDF($('#paper'),D.no+'.pdf','#ffffff',[12,0,14,0])},'Download PDF'),el('button',{class:'btn',type:'button',onclick:()=>window.print()},'Print')));
fillItems()}
function renderPaper(){
const T=totals(),s=S.seller,ty=D.type,rows=D.items.filter(i=>i.desc.trim()||i.rate);
const stat=ty==='quotation'?(D.due?'Valid until '+fd(D.due):'No expiry date'):ty==='receipt'?(T.bal===0?'Paid in full':'Part payment'):(T.bal===0&&T.total>0?'Paid':T.paid>0?'Part paid':'Awaiting payment');

el('div',{class:'pc'},el('small',{},ty==='quotation'?'Prepared for':ty==='receipt'?'Received from':'Billed to'),[c.name||'Client name',c.phone,c.address].filter(Boolean).map((l,i)=>el(i?'span':'b',{},l)))),

rows.map(i=>el('div',{class:'pr'},el('span',{},i.desc),el('span',{class:'n'},String(i.qty)),el('span',{class:'n'},fmt(Math.round(i.rate*100))),el('span',{class:'n'},fmt(lineAmt(i)))))),
el('div',{class:'ps'},sr('Subtotal',fmt(T.sub)),T.disc?sr('Discount'+(D.discType==='pct'?' ('+D.discount+'%)':''),'−'+fmt(T.disc)):null,D.vat?sr('VAT (7.5%)',fmt(T.vat)):null,sr('Total',fmt(T.total),'tot'),

el('div',{},D.notes?[el('small',{},'Notes'),el('p',{},D.notes)]:null,ty==='invoice'&&s.bank?[el('small',{},'Payment details'),el('p',{},s.bank)]:null),
el('div',{class:'sg'},(ty==='quotation'?['Client acceptance','Authorised signature']:[ty==='receipt'?'Received by':'Authorised signature']).map(t=>el('span',{},t)))),
el('div',{class:'pe'},'Thank you for choosing '+s.name));$('#paper').replaceChildren(cx);placeWm()}

/* PDF */
async function exportPDF(n,name,bg,mg=[0,0,0,0]){
if(typeof html2pdf==='undefined'){toast('PDF tool did not load. Check your connection or use Print.');return}
const sy=window.scrollY;window.scrollTo(0,0);n.classList.add('pdf');if(n.id==='paper')placeWm();await new Promise(r=>requestAnimationFrame(()=>r()));
try{await html2pdf().set({margin:mg,filename:name,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:bg,windowWidth:document.documentElement.clientWidth,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.pkg','.ps','.pr','.ao','.rw','.wd','.pay','.pc']}}).from(n).save();toast('PDF downloaded')}
catch(e){toast('PDF failed. Use Print and choose Save as PDF.')}
finally{n.classList.remove('pdf');if(n.id==='paper')placeWm();window.scrollTo(0,sy)}}

/* views and wiring */
function show(n){
const v=n==='documents'?'documents':'proposal';
$('#proposal').hidden=v!=='proposal';$('#documents').hidden=v!=='documents';
document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
renderBrand();if(v==='proposal')renderProposal();else if(!D)startDoc(S.packages[0].id);else{buildForm();renderPaper()}
window.scrollTo(0,0)}
function go(n){if(location.hash==='#'+n)show(n);else location.hash=n}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
const onField=e=>{const t=e.target,k=t.dataset.k;if(!k)return;let v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.n)v=Math.max(0,parseFloat(v)||0);set(k,v);if(k.startsWith('seller.')){save();renderBrand()}if(k==='discType')buildForm();renderPaper()};
$('#form').addEventListener('input',onField);$('#form').addEventListener('change',onField);
$('#form').addEventListener('submit',e=>e.preventDefault());
$('#dlProp').addEventListener('click',()=>exportPDF($('#sheet'),'WilObi_Invoice_App_Proposal.pdf',getComputedStyle(document.body).backgroundColor));
addEventListener('resize',()=>{if(!$('#documents').hidden&&D)placeWm()});let rt;$('#reset').addEventListener('click',e=>{const b=e.currentTarget;if(b.dataset.arm){S=clone(DEF);save();D=null;renderProposal();b.textContent='Reset to defaults';delete b.dataset.arm;toast('Defaults restored');return}
b.dataset.arm=1;b.textContent='Click again to confirm';clearTimeout(rt);rt=setTimeout(()=>{b.textContent='Reset to defaults';delete b.dataset.arm},3500)});
show(location.hash.slice(1));
</script>
